<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Administración de Divisas</title>
    <link rel="icon" href="/static/img/Defilogo1.png" type="image/x-icon">
    <link rel="stylesheet" href="/static/css/stylesLogin.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <header>
        <h1 onclick="irainicio()">DeFi</h1>
    </header>
  
    <main>
        <h1>Iniciar Sesión</h1>
        <form id="form-login">
            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario" placeholder="Ingrese su usuario" required>
            <label for="contraseña">Contraseña:</label>
            <input type="password" id="contraseña" placeholder="Ingrese su contraseña" required>
            <button type="submit">Iniciar Sesión</button>
            <button id="registrarse-btn">Registrarse</button>
        </form>
        <br>
        
    </main>

    <footer>
        <p>&copy; 2024 Cotizaciones DeFi</p>
    </footer>

    <script>
        // Función para verificar si el usuario ya está logueado
        async function checkSession() {
            try {
                const currentUrl = window.location.pathname; // Obtén la ruta actual

                const response = await fetch('https://cotizacionesdefi.com/auth/verify', {
                    method: 'GET',
                    credentials: 'include', // Permite el envío de cookies de sesión
                });

                if (response.ok) {
                    const data = await response.json(); // Obtén los datos de la respuesta JSON
                    if (data.autenticado) {
                        if (currentUrl !== data.redirectUrl) {
                            // Redirige solo si no estás ya en la página de inicio admin
                            window.location.href = data.redirectUrl;
                        }
                    } else {
                        if (currentUrl !== data.redirectUrl) {
                            // Redirige solo si no estás ya en la página de login
                            window.location.href = data.redirectUrl;
                        }
                    }
                } else {
                    console.error('Error en la respuesta del servidor:', response.statusText);
                }
            } catch (error) {
                console.error('Error al verificar la sesión:', error);
            }
        }

        // Llama a la función para verificar la sesión al cargar la página

        function irainicio() {
            fetch('https://cotizacionesdefi.com/auth/inicio', {
                method: 'POST',
                credentials: 'include'
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    Swal.firert('Error.'); // Mostrar un mensaje de error
                    throw new Error('Error en la respuesta');
                }
            })
            .then(data => {
              
                window.location.href = data.redirectUrl;
            })
            .catch(error => {
                console.error('Error en la petición:', error);
                Swal.fire('Error al cerrar sesión, inténtalo de nuevo.'); // Mostrar un mensaje de error
            });
        }

        document.getElementById('form-login').addEventListener('submit', async function(event) {
            event.preventDefault(); // Previene el comportamiento por defecto del formulario
            const usuario = document.getElementById('usuario').value; // Obtiene el valor del campo de usuario
            const contraseña = document.getElementById('contraseña').value; // Obtiene el valor del campo de contraseña

            try {
                const response = await fetch('https://cotizacionesdefi.com/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json', // Especifica que se envía JSON
                        'Accept': '*/*'
                    },
                    // Cuerpo de la solicitud en el formato requerido
                    body: JSON.stringify({ 
                        "username": usuario, // Añade el nombre de usuario
                        "password": contraseña // Añade la contraseña
                    }),
                    credentials: 'include'
                    
                });

                if (response.ok) {
                    const data = await response.json(); // Obtiene la respuesta JSON
                    // Redirige al usuario a la URL proporcionada por el backend
                    window.location.href = data.redirectUrl; 
                } else {
                    const errorMessage = await response.text(); // Obtiene el mensaje de error en caso de fallo
                    // Muestra un mensaje de error
                    Swal.fire('Error', errorMessage, 'error'); 
                }
            } catch (error) {
                console.error('Error al iniciar sesión:', error); // Manejo de errores en la consola
            }
        });

        document.getElementById('registrarse-btn').addEventListener('click', function() {
            Swal.fire({
                title: 'Registrarse',
                html: `
                    <input type="text" id="nuevo-usuario" class="swal2-input" placeholder="Nuevo usuario">
                    <input type="password" id="nueva-contraseña" class="swal2-input" placeholder="Nueva contraseña">
                    <input type="password" id="clave-maestra" class="swal2-input" placeholder="Clave maestra">
                `,
                confirmButtonText: 'Registrar',
                focusConfirm: false,
                preConfirm: () => {
                    const nuevoUsuario = document.getElementById('nuevo-usuario').value;
                    const nuevaContraseña = document.getElementById('nueva-contraseña').value;
                    const claveMaestra = document.getElementById('clave-maestra').value;
                    
                    // Validar que los campos no estén vacíos
                    if (!nuevoUsuario || !nuevaContraseña || !claveMaestra) {
                        Swal.showValidationMessage('Por favor, complete todos los campos');
                        return false;
                    }
                    
                    // Retorna los valores ingresados para usarlos luego
                    return { nuevoUsuario, nuevaContraseña, claveMaestra };
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    const { nuevoUsuario, nuevaContraseña, claveMaestra } = result.value;
                    try {
                        // Realizar la solicitud al backend para registrar al usuario
                        const response = await fetch('https://cotizacionesdefi.com/usuarios', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                username: nuevoUsuario,
                                contraseña: nuevaContraseña,
                                masterKey: claveMaestra // Incluir masterKey en el cuerpo de la solicitud
                            })
                        });

                        if (response.ok) {
                            const usuario = await response.json();  // Obtener el objeto 'Usuarios' de la respuesta
                            Swal.fire('Registrado con éxito', `Usuario: ${nuevoUsuario}`, 'success');
                        } else {
                            const errorMessage = await response.text();
                            Swal.fire('Error',  'credenciales invalidas');
                        }
                    } catch (error) {
                        console.error('Error al registrar:', error);
                        Swal.fire('Error', 'Ocurrió un error durante el registro', 'error');
                    }
                }
            });
        });

    </script>
    
</body>
</html>
